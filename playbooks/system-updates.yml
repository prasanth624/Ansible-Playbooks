# ============================================
# Run this playbook with:
# ansible-playbook -i inventory.ini updates.yml
# ============================================

---
- name: Apply system updates
  hosts: all
  become: yes

  vars:
    reboot_after_update: true

  tasks:
    - name: Update all packages (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
      when: ansible_facts.os_family == "Debian"

    - name: Update all packages (RHEL-based)
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when: ansible_facts.os_family == "RedHat"

    - name: Reboot system if enabled
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after updates"
        reboot_timeout: 600
      when: reboot_after_update
